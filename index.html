<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111713">
<title>Empire Green — V4</title>
<style>
:root{--bg:#111713;--panel:#1d251f;--line:#3b493e;--ink:#f1f0e7;--muted:#a7b0a8;--good:#9fc28e;--warn:#d5ad60;--bad:#d56d68}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#0c100d;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}button{font:inherit;color:inherit}
#app{height:100dvh;width:100vw;max-width:none;margin:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.hud{height:58px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:6px;background:#121814;border-bottom:1px solid var(--line);z-index:30}
.m{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:5px 8px;min-width:0}.m small{display:block;color:var(--muted);font-size:9px;letter-spacing:.08em}.m b{font-size:15px;white-space:nowrap}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#343b36}.lot{position:absolute;inset:0;background:linear-gradient(26deg,#2b312d,#444b45)}
.road{position:absolute;height:12%;background:#242927;border-top:1px solid #7a807a44;border-bottom:1px solid #7a807a44}.road.r{left:-12%;width:58%;bottom:18%;transform:rotate(28deg)}.road.f{left:44%;right:-12%;bottom:11%;transform:rotate(-15deg)}
.bldg{position:absolute;left:20%;right:15%;top:18%;height:50%;filter:drop-shadow(0 14px 9px #0008)}.rear{position:absolute;left:0;width:31%;top:28%;height:51%;background:#717b73;clip-path:polygon(0 0,100% 20%,100% 100%,0 72%)}.front{position:absolute;left:27%;right:0;top:35%;height:44%;background:#919891;clip-path:polygon(0 20%,100% 0,100% 72%,0 100%)}.roof{position:absolute;left:10%;right:5%;top:0;height:47%;background:#b4b8b0;clip-path:polygon(13% 0,83% 0,100% 42%,18% 100%,0 56%);border:2px solid #747a75}.floor2{position:absolute;left:31%;top:6%;width:43%;height:23%;background:#d1d4cd;clip-path:polygon(10% 0,82% 0,100% 42%,18% 100%,0 56%);border:1px solid #777}.sign{position:absolute;right:4%;top:44%;font-weight:1000;font-size:12px;transform:rotate(-12deg);color:#1d271f}.dock{position:absolute;left:2%;top:53%;width:13%;height:11%;background:#333935;border:2px solid #aaa}
.hot{position:absolute;z-index:9;min-width:55px;min-height:50px;border:1px solid #ffffff35;border-radius:12px;background:#111d;color:#fff;font-size:10px;font-weight:900;backdrop-filter:blur(8px)}.grow{left:4%;top:25%}.ops{left:4%;top:43%}.retail{right:4%;top:27%}.brand{right:4%;top:45%}.rd{left:46%;top:7%}
.person{position:absolute;width:10px;height:16px;border-radius:6px 6px 3px 3px;background:#75937e;z-index:10}.person:before,.worker:before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#d3ad87;left:1.5px;top:-6px}.actor{position:absolute;font-size:20px;z-index:5;transition:all 1.05s linear}
.alert{position:absolute;z-index:15;top:8px;left:50%;transform:translateX(-50%);width:min(78%,300px);padding:7px 9px;border:1px solid #a7864f;background:#201e19ef;border-radius:10px;font-size:10px}.alert span{display:block;color:var(--muted)}
.chat{position:absolute;right:8px;bottom:10px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:18px;z-index:20}
.controls{height:60px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#121814;border-top:1px solid var(--line)}.controls button,.actions button,.sheet button{min-height:46px;border:1px solid var(--line);background:var(--panel);border-radius:11px;font-size:11px;font-weight:850}
.room{position:absolute;inset:0;background:#252c27}.rt{height:48px;padding:8px 10px;background:#151b17;border-bottom:1px solid var(--line)}.rt b{display:block}.rt small{color:var(--muted)}.rw{position:absolute;left:0;right:0;top:48px;bottom:112px;background:linear-gradient(145deg,#3a413b,#252b27);overflow:hidden}.fx{position:absolute;padding:6px;border:1px solid #7e867f;background:#7c837d;border-radius:7px;box-shadow:0 6px 8px #0004;font-size:9px;font-weight:900;text-align:center}.plant{position:absolute;width:22px;height:22px;border-radius:50%;background:#6d9865;box-shadow:6px 2px #577f51,-5px 3px #7aa070}.worker{position:absolute;width:10px;height:16px;border-radius:5px;background:#b3996a;transition:all 1s linear}.actions{position:absolute;left:0;right:0;bottom:55px;height:57px;display:flex;gap:6px;padding:5px;overflow-x:auto;background:#151b17;border-top:1px solid var(--line)}.actions button{flex:0 0 138px}.actions small{display:block;color:var(--muted);font-size:8px}.home{position:absolute;z-index:18;left:50%;bottom:calc(7px + env(safe-area-inset-bottom));transform:translateX(-50%);min-width:145px;min-height:44px;border:1px solid #78916f;border-radius:12px;background:#263126;font-weight:1000}
.shade{position:absolute;inset:0;background:#0008;z-index:39}.sheet{position:absolute;z-index:40;left:0;right:0;bottom:0;max-height:75%;overflow:auto;background:#1b211d;border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:10px 10px calc(12px + env(safe-area-inset-bottom))}.handle{width:42px;height:4px;background:#687269;border-radius:10px;margin:0 auto 10px}.sheet h3{margin:3px 0 8px}.card{border:1px solid var(--line);background:#242b26;border-radius:11px;padding:9px;margin:6px 0}.card small{color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tabs .on{border-color:#8cab7c;background:#29342a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid .card{margin:0}
.toasted{position:absolute;inset:0;z-index:100;background:#080a08f3;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.toasted h1{margin:0;font-family:Impact,Haettenschweiler,sans-serif;font-size:66px;letter-spacing:.04em;color:#c59d64;text-shadow:0 3px #3a241b}.toasted p{font-size:11px;color:#bbb;line-height:1.7}.toasted button{min-width:180px;min-height:48px;background:#211d17;border:1px solid #846b47;border-radius:11px;font-weight:1000}

/* Responsive shell: mobile-first, scales to landscape/tablet/desktop */
.stage{container-type:size}
.lot,.room{max-width:1400px;margin:0 auto}
@media (min-width:700px){
  .hud{height:64px;padding:8px 12px;grid-template-columns:180px 180px 180px;justify-content:center;gap:10px}
  .m{padding:7px 12px}.m small{font-size:10px}.m b{font-size:17px}
  .controls{height:68px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));grid-template-columns:repeat(3,minmax(140px,220px));justify-content:center;gap:10px}
  .controls button,.actions button,.sheet button{font-size:12px;min-height:48px}
  .bldg{left:24%;right:22%;top:15%;height:56%}
  .grow{left:12%;top:28%}.ops{left:12%;top:46%}.retail{right:12%;top:30%}.brand{right:12%;top:48%}.rd{left:48%;top:6%}
  .hot{min-width:72px;min-height:58px;font-size:11px}
  .alert{width:min(56%,420px);font-size:11px}
  .chat{right:18px;bottom:16px;width:52px;height:52px}
  .rt{height:54px;padding:9px 14px}.rw{top:54px;bottom:126px}
  .actions{bottom:61px;height:65px;justify-content:center;padding:7px}.actions button{flex:0 0 180px}
  .home{bottom:calc(9px + env(safe-area-inset-bottom));min-width:170px;min-height:46px}
  .sheet{left:50%;right:auto;transform:translateX(-50%);width:min(720px,92vw);border-radius:18px 18px 0 0}
  .grid{grid-template-columns:repeat(3,1fr)}
  .toasted h1{font-size:86px}
}
@media (min-width:1100px){
  .hud{grid-template-columns:220px 220px 220px}
  .bldg{left:28%;right:26%;top:14%;height:58%}
  .grow{left:18%;top:28%}.ops{left:18%;top:47%}.retail{right:18%;top:30%}.brand{right:18%;top:49%}.rd{left:49%;top:5%}
  .hot{min-width:84px;min-height:64px;font-size:12px}
  .actor{font-size:24px}
  .person{transform:scale(1.15);transform-origin:center}
  .chat{right:28px;bottom:22px}
  .sheet{max-height:80%}
}
@media (max-width:430px){
  .hud{height:56px;gap:5px;padding:5px}
  .m{padding:5px 7px}.m small{font-size:8px}.m b{font-size:14px}
  .hot{min-width:52px;min-height:48px;font-size:9px}
  .alert{top:6px;width:min(80%,290px)}
  .controls{height:58px;padding:5px 6px calc(5px + env(safe-area-inset-bottom));gap:5px}
}
@media (orientation:landscape) and (max-height:520px){
  .hud{height:48px;padding:4px 8px}.m{padding:3px 8px}.m small{font-size:8px}.m b{font-size:13px}
  .controls{height:50px;padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
  .controls button{min-height:40px}
  .bldg{top:8%;height:64%;left:27%;right:24%}
  .grow{left:14%;top:22%}.ops{left:14%;top:48%}.retail{right:14%;top:24%}.brand{right:14%;top:50%}.rd{left:49%;top:3%}
  .hot{min-width:60px;min-height:42px}
  .alert{top:5px;width:min(45%,360px)}
  .chat{width:44px;height:44px;bottom:8px}
  .rt{height:42px;padding:5px 10px}.rw{top:42px;bottom:98px}
  .actions{height:51px;bottom:47px;padding:4px}.actions button{min-height:42px}
  .home{bottom:calc(3px + env(safe-area-inset-bottom));min-height:40px}
  .sheet{max-height:88%}
}

</style>
</head>
<body><div id="app"></div>
<script>
(()=>{const BASE={cash:220000,share:7.8,sat:76,heat:48,stock:84,price:38,queue:3,crop:43,cropLen:63,materials:50,lifetime:0,p:{flower:84,processed:0,limited:0},managers:0,rnd:0,room2:false,express:false,running:true,speed:1};let s=structuredClone(BASE),view='home',drawer=null,h=30;const app=document.querySelector('#app');const C=(n,a,b)=>Math.max(a,Math.min(b,n)),M=n=>'$'+Math.round(n).toLocaleString(),harvest=()=>Math.max(0,s.cropLen-s.crop),burn=()=>Math.max(.4,1.8+(s.heat-48)/32+(38-s.price)/12+s.share/16),fixed=()=>(41500+s.managers*3100)/30;
function fc(d){let q=burn()*d,hv=Math.floor((s.crop+d)/s.cropLen),hu=hv*(s.room2?220:145),f=Math.max(0,s.p.flower+hu-q*.76),p=Math.max(0,s.p.processed-q*.16),l=Math.max(0,s.p.limited-q*.08),u=Math.min(q,s.stock+hu),rev=u*s.price*7.4*.87,cash=s.cash+rev-fixed()*d,sat=C(s.sat+(s.express?2:0)-(s.queue>7?4:0)-(f<10?5:0),0,100),heat=C(s.heat+s.rnd*.8+(s.p.limited?2:0),0,100),share=C(s.share+(heat>65?.4:0)+(sat>80?.3:0),0,70),cov=(f+p+l)/Math.max(.1,burn()),bn=cov<8?'Inventory':s.queue>7?'Retail throughput':s.materials<20?'Materials':s.managers<2?'Management bandwidth':s.room2?'Demand generation':'Cultivation capacity';return{cash,rev,u,f,p,l,sat,heat,share,cov,bn,hv,margin:rev?((rev-fixed()*d)/rev*100):0}}
function outlook(){let p=fc(30);return p.cash<-150000||p.cov<5?['RISK','bad']:p.cov<12||p.bn==='Management bandwidth'?['PRESSURE','warn']:['GROWING','good']}
function hud(){let o=outlook();return '<div class=hud><div class=m><small>CASH</small><b>'+M(s.cash)+'</b></div><div class=m><small>MARKET SHARE</small><b>'+s.share.toFixed(1)+'%</b></div><div class=m data-a=outlook><small>30D OUTLOOK</small><b class='+o[1]+'>'+o[0]+'</b></div></div>'}
function controls(){return '<div class=controls><button data-a=pause>'+(s.running?'Ⅱ PAUSE':'▶ RUN')+'</button><button data-a=speed>'+s.speed+'× SPEED</button><button data-a=outlook>◫ OUTLOOK</button></div>'}
function signal(){let p=fc(30),a='',b='';if(s.stock<25){a='Stock pressure';b='~'+Math.round(p.cov)+' days projected coverage'}else if(harvest()<7){a='Harvest approaching';b=harvest()+' days • projected +'+(s.room2?220:145)+' units'}else if(s.queue>7){a='Front queue growing';b='Demand may outrun service capacity'}else{a='Next constraint';b=p.bn}return '<div class=alert data-a=outlook><b>'+a+'</b><span>'+b+'</span></div>'}
function property(){let ppl=Array.from({length:Math.min(8,s.queue)},(_,i)=>'<div class=person data-person='+i+' style="right:'+(19+i*2.8)+'%;top:'+(69+i*.5)+'%"></div>').join('');return '<div class=lot><div class="road r"></div><div class="road f"></div><div class=bldg><div class=rear></div><div class=front></div><div class=roof></div><div class=floor2></div><div class=dock></div><div class=sign>EMPIRE GREEN</div></div><button class="hot grow" data-room=grow>GROW<br><small>'+harvest()+'d</small></button><button class="hot ops" data-room=ops>OPS<br><small>'+s.materials+' mat.</small></button><button class="hot retail" data-room=retail>RETAIL<br><small>'+s.queue+' inside</small></button><button class="hot brand" data-room=brand>BRAND<br><small>'+Math.round(s.heat)+' heat</small></button><button class="hot rd" data-room=rd>R&D<br><small>'+s.rnd+' wins</small></button><div class=actor id=truck style="left:2%;top:70%">🚚</div><div class=actor id=car style="left:91%;top:79%">🚙</div>'+ppl+signal()+'<button class=chat data-a=feed>💬</button></div>'}
function draw(){if(s.cash<=-333333)return toast();app.innerHTML=hud()+'<div class=stage>'+property()+'</div>'+controls()+sheet();setTimeout(()=>{let t=document.querySelector('#truck'),c=document.querySelector('#car');if(t)t.style.left='19%';if(c)c.style.left='76%'},80)}
function room(n){view=n;let T='',sub='',w='',a='';if(n==='retail'){T='RETAIL FLOOR';sub='Watch customers decide';w='<div class=fx style="left:8%;top:18%;width:25%">MENU<br>$'+s.price+'</div><div class=fx style="left:39%;top:45%;width:25%">COUNTER</div><div class=fx style="right:7%;top:18%;width:22%">'+(s.express?'EXPRESS':'ENTRY')+'</div>'+Array.from({length:Math.min(10,s.queue)},(_,i)=>'<div class=person data-person='+i+' style="left:'+(16+(i%5)*15)+'%;top:'+(62+Math.floor(i/5)*16)+'%"></div>').join('');a='<button data-a=down>PRICE −$2<small>Demand ↑ margin ↓</small></button><button data-a=up>PRICE +$2<small>Margin ↑ resistance ↑</small></button><button data-a=express>'+(s.express?'EXPRESS BUILT':'BUILD EXPRESS')+'<small>'+(s.express?'Queue relief active':'$18,000')+'</small></button>'}
if(n==='grow'){T='FLOWER ROOM';sub='Production is physical';w=Array.from({length:18},(_,i)=>'<div class=plant style="left:'+(8+(i%6)*15)+'%;top:'+(20+Math.floor(i/6)*24)+'%"></div>').join('')+'<div class=worker id=w style="left:15%;top:78%"></div><div class=fx style="right:5%;top:8%">HARVEST<br>'+harvest()+' DAYS</div>';a='<button data-a=quality>QUALITY PUSH<small>Less yield • more heat</small></button><button data-a=yield>YIELD PUSH<small>More units • less heat</small></button><button data-a=room2>'+(s.room2?'FLOWER II ONLINE':'FLOWER ROOM II')+'<small>'+(s.room2?'Capacity expanded':'$52,000')+'</small></button>'}
if(n==='ops'){T='BACKEND OPS';sub='Inventory becomes movement';w='<div class=fx style="left:7%;top:18%;width:28%">DRY / CURE</div><div class=fx style="left:39%;top:45%;width:28%">MATERIALS<br>'+s.materials+'</div><div class=fx style="right:7%;top:18%;width:22%">DOCK</div><div class=actor style="left:75%;top:65%">📦</div>';a='<button data-a=materials>ORDER MATERIALS<small>$1,500 • +40</small></button><button data-a=process>PROCESS BATCH<small>Convert 20 flower</small></button><button data-a=hire>HIRE OPS LEAD<small>$3,100/mo</small></button>'}
if(n==='brand'){T='BRAND / MARKET';sub='Demand has consequences';w='<div class=fx style="left:8%;top:20%;width:35%">HEAT<br>'+Math.round(s.heat)+'</div><div class=fx style="right:8%;top:20%;width:35%">SHARE<br>'+s.share.toFixed(1)+'%</div><div class=fx style="left:30%;top:55%;width:40%">LIMITED DROP<br>'+s.p.limited+' units</div>';a='<button data-a=campaign>LOCAL CAMPAIGN<small>$12k • traffic ↑</small></button><button data-a=drop>LIMITED DROP<small>Use 18 flower</small></button><button data-a=hire>HIRE BRAND LEAD<small>$3,100/mo</small></button>'}
if(n==='rd'){T='SECOND FLOOR • R&D';sub='Where the identity gets made';w='<div class=fx style="left:7%;top:18%;width:27%">GENETICS</div><div class=fx style="left:37%;top:46%;width:27%">PRODUCT LAB</div><div class=fx style="right:7%;top:18%;width:27%">WINS<br>'+s.rnd+'</div><div class=worker id=w style="left:22%;top:70%"></div>';a='<button data-a=rnd>RUN EXPERIMENT<small>$7k • product upside</small></button><button data-a=pheno>PHENO PROJECT<small>$9.5k • brand upside</small></button><button data-a=hire>HIRE R&D LEAD<small>$3,100/mo</small></button>'}
app.innerHTML=hud()+'<div class=stage><div class=room><div class=rt><b>'+T+'</b><small>'+sub+'</small></div><div class=rw>'+w+'</div><div class=actions>'+a+'</div><button class=home data-a=home>⌂ PROPERTY</button></div></div>'+sheet();let x=document.querySelector('#w');if(x)setTimeout(()=>{x.style.left='68%';x.style.top='42%'},80)}
function sheet(){if(!drawer)return'';if(drawer==='feed')return '<div class=shade data-a=close></div><div class=sheet><div class=handle></div><h3>Live customer feed</h3><div class=card>“I came for the house flower.”</div><div class=card>“'+(s.queue>7?'The line is moving slow.':'This place is moving pretty quick.')+'”</div><div class=card>“'+(s.price>42?'That eighth is getting expensive.':'Price feels fair.')+'”</div><div class=card>“'+(s.stock<25?'They’re almost out again.':'I’d come back.')+'”</div><button data-a=close>CLOSE</button></div>';if(drawer==='person')return '<div class=shade data-a=close></div><div class=sheet><div class=handle></div><h3>Customer</h3><div class=card><small>BUDGET</small><br>$'+(32+Math.floor(Math.random()*45))+'</div><div class=card><small>CURRENT THOUGHT</small><br>'+(s.queue>7?'“This line is ridiculous.”':s.price>44?'“I might go somewhere cheaper.”':'“I want to see what the house flower is like.”')+'</div><button data-a=close>CLOSE</button></div>';let p=fc(h);return '<div class=shade data-a=close></div><div class=sheet><div class=handle></div><h3>Business Outlook</h3><div class=tabs>'+[30,60,90].map(d=>'<button class="'+(h===d?'on':'')+'" data-h='+d+'>'+d+' DAYS</button>').join('')+'</div><div class=card><b>Likely next constraint: '+p.bn+'</b><br><small>Forecast reacts to pricing, production, staffing, mix and demand.</small></div><div class=grid><div class=card><small>PROJECTED CASH</small><br><b>'+M(p.cash)+'</b></div><div class=card><small>REVENUE</small><br><b>'+M(p.rev)+'</b></div><div class=card><small>HOUSE FLOWER</small><br><b>'+Math.round(p.f)+' units</b></div><div class=card><small>PROCESSED</small><br><b>'+Math.round(p.p)+' units</b></div><div class=card><small>LIMITED</small><br><b>'+Math.round(p.l)+' units</b></div><div class=card><small>STOCK COVERAGE</small><br><b>'+Math.round(p.cov)+' days</b></div><div class=card><small>HARVESTS</small><br><b>'+p.hv+'</b></div><div class=card><small>UNITS SOLD</small><br><b>'+Math.round(p.u)+'</b></div><div class=card><small>SATISFACTION</small><br><b>'+Math.round(p.sat)+'%</b></div><div class=card><small>BRAND HEAT</small><br><b>'+Math.round(p.heat)+'</b></div><div class=card><small>MARKET SHARE</small><br><b>'+p.share.toFixed(1)+'%</b></div><div class=card><small>OPERATING MARGIN</small><br><b>'+Math.round(p.margin)+'%</b></div></div><button data-a=close>CLOSE</button></div>'}
function spend(n){s.cash-=n;if(s.cash<=-333333){toast();return false}return true}function rerender(){view==='home'?draw():room(view)}
function act(a){if(a==='home'){view='home';drawer=null;draw()}else if(a==='pause'){s.running=!s.running;rerender()}else if(a==='speed'){s.speed=s.speed===1?3:s.speed===3?8:1;rerender()}else if(a==='outlook'){drawer='outlook';rerender()}else if(a==='feed'){drawer='feed';rerender()}else if(a==='close'){drawer=null;rerender()}else if(a==='down'){s.price=Math.max(24,s.price-2);rerender()}else if(a==='up'){s.price=Math.min(60,s.price+2);rerender()}else if(a==='express'&&!s.express&&spend(18000)){s.express=true;s.queue=Math.max(0,s.queue-2);rerender()}else if(a==='room2'&&!s.room2&&spend(52000)){s.room2=true;rerender()}else if(a==='materials'&&spend(1500)){s.materials+=40;rerender()}else if(a==='process'&&s.p.flower>=20){s.p.flower-=20;s.p.processed+=15;s.stock=s.p.flower+s.p.processed+s.p.limited;rerender()}else if(a==='campaign'&&spend(12000)){s.heat=C(s.heat+12,0,100);s.share+=.8;s.queue+=2;rerender()}else if(a==='drop'&&s.p.flower>=18){s.p.flower-=18;s.p.limited+=12;s.heat=C(s.heat+6,0,100);s.stock=s.p.flower+s.p.processed+s.p.limited;rerender()}else if(a==='rnd'&&spend(7000)){s.rnd++;s.p.processed+=8;s.heat+=4;rerender()}else if(a==='pheno'&&spend(9500)){s.rnd++;s.heat+=7;s.share+=.3;rerender()}else if(a==='hire'&&spend(3100)){s.managers++;rerender()}else if(a==='quality'){s.heat+=2;s.cropLen+=2;rerender()}else if(a==='yield'){s.cropLen=Math.max(52,s.cropLen-2);s.heat=Math.max(0,s.heat-1);rerender()}else if(a==='restart'){s=structuredClone(BASE);view='home';drawer=null;h=30;draw()}}
function toast(){s.running=false;drawer=null;app.innerHTML='<div class=toasted><h1>TOASTED</h1><p>EMPIRE GREEN IS INSOLVENT<br><br>FINAL SHARE '+s.share.toFixed(1)+'%<br>LIFETIME REVENUE '+M(s.lifetime)+'<br>PEAK HEAT '+Math.round(s.heat)+'</p><button data-a=restart>START OVER</button></div>'}
app.addEventListener('click',e=>{let H=e.target.closest('[data-h]');if(H){h=+H.dataset.h;rerender();return}if(e.target.closest('[data-person]')){drawer='person';rerender();return}let R=e.target.closest('[data-room]');if(R){drawer=null;room(R.dataset.room);return}let A=e.target.closest('[data-a]');if(A)act(A.dataset.a)})
setInterval(()=>{if(!s.running)return;for(let z=0;z<s.speed;z++){let d=burn(),sold=Math.min(d,s.stock),rev=sold*s.price*7.4*.87;s.cash+=rev-fixed();s.lifetime+=rev;let f=Math.min(s.p.flower,sold*.76);s.p.flower-=f;let left=sold-f,p=Math.min(s.p.processed,left);s.p.processed-=p;left-=p;s.p.limited=Math.max(0,s.p.limited-left);s.stock=Math.max(0,s.p.flower+s.p.processed+s.p.limited);s.crop++;if(s.crop>=s.cropLen){let y=s.room2?220:145;s.p.flower+=y;s.stock+=y;s.crop=0;s.materials=Math.max(0,s.materials-15)}s.queue=C(s.queue+(Math.random()<.45?1:-1)-(s.express?1:0),0,12);if(s.stock<10)s.sat=C(s.sat-.25,0,100);else if(s.queue<5)s.sat=C(s.sat+.03,0,100);if(s.managers&&s.materials<15&&s.cash>1500){s.cash-=1500;s.materials+=40}if(s.cash<=-333333)return toast()}rerender()},1150);
document.addEventListener('visibilitychange',()=>{if(document.hidden)s.running=false});draw()})();
</script>
