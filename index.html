<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c140e">
<title>Empire Green — Pixi Rebuild</title>
<link rel="stylesheet" href="./pixi.css?v=1">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="metric"><span>Cash</span><b id="cash">$220,000</b></div>
    <div class="metric"><span>Share</span><b id="share">7.8%</b></div>
    <div class="metric"><span>Rating</span><b id="rating">76</b></div>
    <div class="metric"><span>Day</span><b id="day">1</b></div>
  </header>

  <main id="gameHost">
    <div id="status" class="status">Loading Pixi…</div>
    <button id="thought" class="thought">Guests are arriving…</button>
  </main>

  <nav class="toolbar">
    <button id="pause">Ⅱ</button>
    <button id="speed">1×</button>
    <button id="products">Products</button>
    <button id="staff">Staff</button>
    <button id="build">Build</button>
  </nav>
</div>

<div id="sheetLayer"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.19.0/dist/pixi.min.js"></script>
<script src="./pixi-game.js?v=1"></script>
</body>
</html>
