<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101712" />
  <title>Empire Green — V4.2</title>
  <link rel="stylesheet" href="./styles.css?v=42" />
</head>
<body>
  <div id="app" class="app">
    <header class="hud">
      <button class="metric metric--button" data-open="outlook" aria-label="Open business outlook">
        <span>Cash</span><strong id="cashValue">$220,000</strong>
      </button>
      <div class="metric">
        <span>Market share</span><strong id="shareValue">7.8%</strong>
      </div>
      <button class="metric metric--button" data-open="outlook">
        <span>30D outlook</span><strong id="outlookValue" class="good">Growing</strong>
      </button>
    </header>

    <main id="stage" class="stage" aria-live="polite"></main>

    <nav class="dockbar dockbar--tycoon">
      <button id="pauseBtn" data-action="pause">Ⅱ</button>
      <button id="speedBtn" data-action="speed">1×</button>
      <button data-open="products">Products</button>
      <button data-open="staff">Staff</button>
      <button data-open="outlook">Reports</button>
    </nav>

    <div id="toast" class="toast" role="status"></div>
    <div id="panelLayer"></div>
    <div id="gameOverLayer"></div>
  </div>

  <script src="./app.js?v=42"></script>
</body>
</html>
