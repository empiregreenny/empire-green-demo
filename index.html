<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0d1510" />
  <title>Empire Green — Tycoon Rebuild</title>
  <link rel="stylesheet" href="./styles.css?v=1" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="stat" data-panel="finance"><span>Cash</span><strong id="cashStat">$220,000</strong></button>
      <div class="stat"><span>Share</span><strong id="shareStat">7.8%</strong></div>
      <div class="stat"><span>Rating</span><strong id="ratingStat">76</strong></div>
      <div class="stat"><span>Day</span><strong id="dayStat">1</strong></div>
    </header>
    <main class="game-shell">
      <canvas id="game" aria-label="Empire Green tycoon property"></canvas>
      <button id="thoughtButton" class="thought-pill" data-panel="thoughts">Guests: loading…</button>
      <div id="notice" class="notice"></div>
    </main>
    <nav class="toolbar">
      <button id="pauseBtn" data-action="pause">Ⅱ</button>
      <button id="speedBtn" data-action="speed">1×</button>
      <button data-panel="build">Build</button>
      <button data-panel="products">Products</button>
      <button data-panel="staff">Staff</button>
      <button data-panel="reports">Reports</button>
    </nav>
  </div>
  <div id="modalLayer"></div>
  <div id="gameOverLayer"></div>
  <script src="./game.js?v=1"></script>
</body>
</html>
